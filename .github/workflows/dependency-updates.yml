name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  dependency-update:
    name: 🔄 Update Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🔧 Make mvnw executable
      run: chmod +x mvnw

    - name: 🔍 Check for dependency updates
      run: ./mvnw versions:display-dependency-updates versions:display-plugin-updates

    - name: 🆙 Update minor and patch versions
      run: |
        ./mvnw versions:update-properties -DallowMajorUpdates=false -DallowMinorUpdates=true
        ./mvnw versions:use-latest-releases -DallowMajorUpdates=false -DallowMinorUpdates=true

    - name: 🧪 Test updates
      run: ./mvnw clean test -B

    - name: 📝 Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies'
        title: '🔄 Automated Dependency Updates'
        body: |
          This PR contains automated dependency updates.
          
          ## Changes
          - Updated minor and patch versions of dependencies
          - All tests are passing
          
          Please review the changes before merging.
        branch: automated-dependency-updates
        delete-branch: true

  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🔧 Make mvnw executable
      run: chmod +x mvnw

    - name: 🔍 Run security audit
      run: ./mvnw org.owasp:dependency-check-maven:check -B

    - name: 📤 Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-audit-report
        path: target/dependency-check-report.html

    - name: 🚨 Create issue for vulnerabilities
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '🚨 Security Vulnerabilities Detected',
            body: 'Security vulnerabilities have been detected in the dependencies. Please check the security audit report in the latest workflow run.',
            labels: ['security', 'dependencies']
          })